server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $user_service user-service:3000;
    set $task_service task-service:3000;
    set $notification_service notification-service:3000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    location ~ ^/api/(auth|profile|users)(/|$) {
        proxy_pass http://$user_service$request_uri;
    }

    location ~ ^/api/tasks(/|$) {
        proxy_pass http://$task_service$request_uri;
    }

    location ~ ^/api/notifications(/|$) {
        proxy_pass http://$notification_service$request_uri;
    }

    location /api {
        default_type application/json;
        return 404 '{"message":"Route not found."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
